<!DOCTYPE html>
<!--
  scan-preview.html —— 扫描演出（engine/scan.js）的取点 + 调参工具。
  调 scanPoints、框的大小、马赛克粗细、节奏的时候不用真的把理智打到 30 以下，
  开这个页面直接对着真地图点、拖、播。

  左键点地图空白处加一个点，拖动已有的点挪位置，右键点掉；右侧面板调参数；
  「播放」按当前参数演一次；「复制 scanPoints」把点位数组拷出来贴回
  assets/maps/hotspots.json。

  要用本地静态服务器打开（跟游戏本体一样，file:// 下 ES module 会被拦），在项目根目录
  执行 npx serve . 或 python -m http.server，再访问 /tools/scan-preview.html。

  注：这里复刻了 map.js 的 .map-image-box 布局（按 object-fit:contain 的实际渲染矩形
  摆盒子），坐标系跟游戏里完全一致，所以这里取到的百分比拿去游戏里就是对的。
  但这里没有缩放/平移——扫描层在游戏里是被 .map-content 的 transform 带着走的。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫描演出预览</title>
<link rel="stylesheet" href="../engine/ui.css">
<style>
  body { margin: 0; overflow: hidden; }
  #stage { position: absolute; inset: 0; right: 300px; background: #0d0c0b; overflow: hidden; }

  #panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 300px;
    z-index: 500;
    overflow-y: auto;
    padding: 14px;
    box-sizing: border-box;
    background: rgba(28, 28, 30, 0.96);
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 13px;
    line-height: 1.5;
  }
  #panel h3 { margin: 16px 0 8px; font-size: 12px; letter-spacing: .08em; color: #9aa0a6; text-transform: uppercase; }
  #panel h3:first-child { margin-top: 0; }
  #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  #panel input[type="number"] { width: 76px; font: inherit; color: inherit; background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 6px; padding: 3px 6px; }
  #panel .btn { width: 100%; margin-top: 8px; }
  #panel .hint { color: #8a8f94; font-size: 12px; margin: 8px 0 0; }
  #out { width: 100%; height: 150px; box-sizing: border-box; margin-top: 8px; font: 11px/1.45 ui-monospace, Consolas, monospace; color: #cfd3d6; background: #141414; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px; resize: vertical; }

  /* 取点标记：只在工具里有，游戏里没有这个东西 */
  .pt {
    position: absolute;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border: 1px solid #fff;
    border-radius: 50%;
    background: rgba(255, 90, 70, .75);
    cursor: grab;
  }
  .pt:hover { background: rgba(255, 160, 70, .95); }
  .pt.dragging { cursor: grabbing; }
  .pt::after {
    content: attr(data-i);
    position: absolute; left: 14px; top: -3px;
    font: 10px/1 ui-monospace, Consolas, monospace; color: rgba(255,255,255,.7);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="map-content" style="transform: none;">
      <div class="map-image-box">
        <img class="map-image" src="../assets/maps/white-lake-map-now.png" alt="">
      </div>
    </div>
  </div>

  <div id="panel">
    <h3>演出</h3>
    <label>框数 count <input type="number" id="in-count" value="10" min="1" max="30"></label>
    <label>框宽下限 boxMin <input type="number" id="in-boxmin" value="4.5" step="0.5" min="1" max="30"></label>
    <label>框宽上限 boxMax <input type="number" id="in-boxmax" value="10" step="0.5" min="1" max="40"></label>
    <label>马赛克格数下限 <input type="number" id="in-gridmin" value="6" min="2" max="40"></label>
    <label>马赛克格数上限 <input type="number" id="in-gridmax" value="12" min="2" max="60"></label>
    <label>错峰 staggerMs <input type="number" id="in-stagger" value="110" step="10" min="0" max="600"></label>
    <label>锁定 growMs <input type="number" id="in-grow" value="280" step="20" min="0" max="1500"></label>
    <label>停留 holdMs <input type="number" id="in-hold" value="2800" step="100" min="0" max="12000"></label>
    <label>淡出 fadeMs <input type="number" id="in-fade" value="800" step="50" min="0" max="4000"></label>
    <label>读数重抽 ms <input type="number" id="in-scramble" value="150" step="10" min="0" max="2000"></label>
    <label>引线概率 <input type="number" id="in-link" value="0.72" step="0.05" min="0" max="1"></label>
    <label>红字概率 bleedChance <input type="number" id="in-bleed" value="0.4" step="0.05" min="0" max="1"></label>
    <p class="hint">红字概率是<b>每个框各掷一次</b>。想确认红色生效就调成 1，每个框都会出 bleedWords 里的红色长乱码。<br>已载入 <b id="bleed-count">0</b> 条 bleedWords。</p>
    <button class="btn" id="btn-play">播放一次</button>
    <button class="btn" id="btn-loop">循环播放：关</button>

    <h3>点位</h3>
    <p class="hint">左键点地图加点 · 拖动挪位置 · 右键点掉<br>当前 <b id="pt-count">0</b> 个点</p>
    <button class="btn" id="btn-load">载入 hotspots.json 里的点</button>
    <button class="btn" id="btn-clear">全部清空</button>
    <textarea id="out" readonly></textarea>
    <button class="btn" id="btn-copy">复制 scanPoints</button>
  </div>

<script type="module">
import * as scanSys from '../engine/scan.js';

const stage = document.getElementById('stage');
const box = stage.querySelector('.map-image-box');
const img = stage.querySelector('.map-image');

let points = [];
// bleedWords 也必须从 hotspots.json 读进来传给 scan.js：不传的话 scan.js 会退回
// DEFAULTS.bleedWords（空数组），红色那条就永远不会出现，预览里只剩白色短读数。
let bleedWords = [];
let looping = false;
let loopTimer = 0;

// ---- 复刻 map.js 的 layoutImageBox()：把 .map-image-box 摆到 object-fit:contain
//      实际渲染出来的那个矩形上，百分比坐标才对应图片本身而不是视口 ----
function layoutImageBox() {
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!vw || !vh || !nw || !nh) return;
  let bw, bh;
  if (vw / vh > nw / nh) { bh = vh; bw = vh * (nw / nh); }
  else { bw = vw; bh = vw * (nh / nw); }
  box.style.left = `${(vw - bw) / 2}px`;
  box.style.top = `${(vh - bh) / 2}px`;
  box.style.width = `${bw}px`;
  box.style.height = `${bh}px`;
}
img.onload = () => { layoutImageBox(); renderPoints(); };
window.addEventListener('resize', () => { layoutImageBox(); });
layoutImageBox();

const num = id => Number(document.getElementById(id).value);

function cfg() {
  return {
    points,
    count: num('in-count'),
    boxMin: num('in-boxmin'),
    boxMax: num('in-boxmax'),
    gridMin: num('in-gridmin'),
    gridMax: num('in-gridmax'),
    staggerMs: num('in-stagger'),
    growMs: num('in-grow'),
    holdMs: num('in-hold'),
    fadeMs: num('in-fade'),
    scrambleMs: num('in-scramble'),
    linkChance: num('in-link'),
    bleedWords,
    bleedChance: num('in-bleed')
  };
}

function play() {
  if (!points.length) { alert('先在地图上点几个点'); return; }
  scanSys.play(cfg()).then(() => {
    if (looping) loopTimer = setTimeout(play, 400);
  });
}

document.getElementById('btn-play').addEventListener('click', () => { looping = false; play(); });

document.getElementById('btn-loop').addEventListener('click', (e) => {
  looping = !looping;
  e.target.textContent = `循环播放：${looping ? '开' : '关'}`;
  clearTimeout(loopTimer);
  if (looping) play(); else scanSys.cancel();
});

// ---- 取点 ----
function pctFromEvent(e) {
  const r = box.getBoundingClientRect();
  return {
    x: Number((((e.clientX - r.left) / r.width) * 100).toFixed(2)),
    y: Number((((e.clientY - r.top) / r.height) * 100).toFixed(2))
  };
}

stage.addEventListener('click', (e) => {
  if (e.target.classList.contains('pt')) return; // 点在已有标记上不算加点
  const p = pctFromEvent(e);
  if (p.x < 0 || p.x > 100 || p.y < 0 || p.y > 100) return; // 点在黑边上，忽略
  points.push(p);
  renderPoints();
});

stage.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!e.target.classList.contains('pt')) return;
  points.splice(Number(e.target.dataset.i), 1);
  renderPoints();
});

// 拖动：pointer capture，松手才写回坐标
let dragIdx = -1;
stage.addEventListener('pointerdown', (e) => {
  if (!e.target.classList.contains('pt')) return;
  dragIdx = Number(e.target.dataset.i);
  e.target.classList.add('dragging');
  e.target.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (dragIdx < 0) return;
  const p = pctFromEvent(e);
  points[dragIdx].x = Math.min(100, Math.max(0, p.x));
  points[dragIdx].y = Math.min(100, Math.max(0, p.y));
  renderPoints();
});
stage.addEventListener('pointerup', () => { dragIdx = -1; });

function renderPoints() {
  for (const el of box.querySelectorAll('.pt')) el.remove();
  points.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'pt';
    el.dataset.i = i;
    el.style.left = `${p.x}%`;
    el.style.top = `${p.y}%`;
    box.appendChild(el);
  });
  document.getElementById('pt-count').textContent = points.length;
  document.getElementById('out').value =
    '"scanPoints": [\n' +
    points.map(p => `    { "x": ${p.x.toFixed(2)}, "y": ${p.y.toFixed(2)} }`).join(',\n') +
    '\n  ],';
}

document.getElementById('btn-clear').addEventListener('click', () => { points = []; renderPoints(); });

document.getElementById('btn-load').addEventListener('click', async () => {
  try {
    const d = await (await fetch('../assets/maps/hotspots.json')).json();
    points = (d.scanPoints || []).map(p => ({ ...p }));
    bleedWords = d.bleedWords || [];
    document.getElementById('bleed-count').textContent = bleedWords.length;
    if (d.bleedChance !== undefined) document.getElementById('in-bleed').value = d.bleedChance;
    renderPoints();
  } catch (err) {
    alert('读不到 hotspots.json：' + err.message + '\n（是不是直接用 file:// 打开的？要用本地服务器）');
  }
});

document.getElementById('btn-copy').addEventListener('click', async () => {
  const t = document.getElementById('out');
  try { await navigator.clipboard.writeText(t.value); alert('已复制'); }
  catch { t.select(); document.execCommand('copy'); } // 部分浏览器拒绝 clipboard API 时退回选中复制
});

document.getElementById('btn-load').click(); // 开页面先把现有点位载进来
</script>
</body>
</html>
