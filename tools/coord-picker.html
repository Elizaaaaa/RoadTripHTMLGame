<!DOCTYPE html>
<!--
  coord-picker.html —— 地图坐标拾取小工具（design-doc.md 第 7 节第 3 条，用法见 README.md）。
  独立于游戏引擎，纯前端单文件，双击直接用浏览器打开即可，不需要起本地服务器。

  用法：拖放 / 选择 / 粘贴一张地图图片进来 → 在图上点击想放标记的位置 → 右侧列表里
  改 id / name / type → 点「复制 JSON」或「下载 hotspots.json」，把结果贴进
  assets/maps/hotspots.json 的 hotspots 数组。坐标就是 assets/maps/hotspots.json
  里 x/y 字段的定义：像素位置 ÷ 图片原始宽或高 × 100，跟图片实际显示大小无关。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>地图坐标拾取工具</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1c1c1c;
    --line: #3a3a3a;
    --text: #d8d8d8;
    --text-dim: #8a8a8a;
    --accent: #ff9900;
    --accent-2: #00ccff;
    --danger: #ff4433;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0 12px 0 0; color: var(--accent); white-space: nowrap; }
  header .hint { font-size: 12px; color: var(--text-dim); }

  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--line); color: var(--text); }

  input[type="text"], input[type="number"], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 6px; font-size: 12px;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: var(--accent-2); }

  main { flex: 1; display: flex; min-height: 0; }

  #stage-wrap {
    flex: 1; position: relative; min-width: 0;
    background: repeating-conic-gradient(#151515 0% 25%, #101010 0% 50%) 50% / 24px 24px;
  }
  #stage {
    position: absolute; inset: 0; overflow: hidden; cursor: crosshair;
  }
  #stage.panning { cursor: grabbing; }
  #stage.empty { display: flex; align-items: center; justify-content: center; cursor: default; }
  #drop-hint {
    color: var(--text-dim); text-align: center; font-size: 13px; line-height: 2;
    border: 1px dashed var(--line); border-radius: 10px; padding: 32px 48px;
  }
  #stage.dragover #drop-hint { border-color: var(--accent-2); color: var(--accent-2); }

  #content { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #map-img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }

  .marker {
    position: absolute; transform-origin: 0 0; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; cursor: grab;
  }
  .marker:active { cursor: grabbing; }
  .marker .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #1a1a1a;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .marker.basecamp .dot { background: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); }
  .marker .tag {
    margin-top: 2px; font-size: 11px; white-space: nowrap;
    background: rgba(0,0,0,0.78); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; color: var(--text);
  }
  .marker.flash .dot { animation: flash 0.6s ease; }
  @keyframes flash { 0%,100% { box-shadow: 0 0 0 1px var(--accent); } 50% { box-shadow: 0 0 0 6px rgba(255,153,0,0.5); } }

  #hover-readout {
    position: absolute; left: 10px; bottom: 10px; z-index: 5;
    background: rgba(0,0,0,0.72); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--text-dim); pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hover-readout b { color: var(--accent-2); }

  #zoom-box {
    position: absolute; right: 10px; bottom: 10px; z-index: 5; display: flex; gap: 4px;
  }

  aside {
    width: 380px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  aside .field-row {
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; font-size: 12px;
  }
  aside .field-row input[type="text"] { flex: 1; min-width: 0; }

  #point-list { flex: 1; overflow-y: auto; padding: 6px; }
  .point-row {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px;
    background: var(--panel-2);
  }
  .point-row.highlight { border-color: var(--accent-2); }
  .point-row .line1 { display: flex; gap: 6px; margin-bottom: 4px; }
  .point-row .line1 input[type="text"] { width: 0; flex: 1; }
  .point-row .line2 { display: flex; gap: 6px; align-items: center; }
  .point-row .line2 input[type="number"] { width: 62px; }
  .point-row .line2 select { flex: 0 0 auto; }
  .point-row .idx { color: var(--text-dim); font-size: 11px; width: 18px; flex: 0 0 auto; text-align: right; }
  .point-row button.del { margin-left: auto; padding: 3px 8px; }
  #empty-list-hint { color: var(--text-dim); font-size: 12px; padding: 20px 12px; text-align: center; }

  #export-box { border-top: 1px solid var(--line); padding: 10px 12px; }
  #export-box .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
  #export-box .btn-row button { flex: 1; }
  #export-json {
    width: 100%; height: 120px; resize: vertical; font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; background: #0d0d0d; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px;
  }
  #copy-status { font-size: 11px; color: var(--accent-2); height: 14px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>📍 地图坐标拾取工具</h1>
  <button id="btn-pick-file">选择图片…</button>
  <input type="file" id="file-input" accept="image/*" hidden>
  <span class="hint">或拖放图片到画布 / Ctrl+V 粘贴剪贴板里的图片</span>
  <span style="flex:1"></span>
  <button id="btn-clear-points" class="danger">清空所有点</button>
</header>

<main>
  <div id="stage-wrap">
    <div id="stage" class="empty">
      <div id="drop-hint">拖一张地图图片到这里<br>或用左上角「选择图片…」按钮 / Ctrl+V 粘贴</div>
    </div>
    <div id="hover-readout" style="display:none;">
      悬停：x <b id="hover-x">--</b>% ・ y <b id="hover-y">--</b>%　（像素 <span id="hover-px">--</span>）
    </div>
    <div id="zoom-box" style="display:none;">
      <button id="btn-zoom-out">－</button>
      <button id="btn-zoom-reset">重置视图</button>
      <button id="btn-zoom-in">＋</button>
    </div>
  </div>

  <aside>
    <div class="field-row">
      <span class="hint" style="white-space:nowrap;color:var(--text-dim);">mapImage</span>
      <input type="text" id="map-image-path" placeholder="/assets/maps/xxx.png">
    </div>
    <div id="point-list">
      <div id="empty-list-hint">还没有点。在左边地图上点击一下试试——<br>点击 = 新增一个点，拖动已有的点 = 微调位置。</div>
    </div>
    <div id="export-box">
      <div class="btn-row">
        <button id="btn-copy" class="primary">复制 JSON</button>
        <button id="btn-download" class="primary">下载 hotspots.json</button>
      </div>
      <textarea id="export-json" readonly spellcheck="false"></textarea>
      <div id="copy-status"></div>
    </div>
  </aside>
</main>

<script>
'use strict';

// ---------- 状态 ----------

let naturalW = 0, naturalH = 0;   // 图片原始像素宽高（x/y 百分比就是基于这两个数算的）
let scale = 1, tx = 0, ty = 0;    // #content 的当前缩放/平移
const MIN_SCALE = 0.02, MAX_SCALE = 12;

let points = []; // { id, name, type, x, y }  —— x/y 单位：百分比 0-100
let nextSeq = 1;

let isPointerDown = false;
let dragMode = null;      // 'pan' | 'marker' | null
let dragMarkerIdx = -1;
let dragMoved = 0;
let dragStartClientX = 0, dragStartClientY = 0;
let dragStartTx = 0, dragStartTy = 0;
const CLICK_DRAG_THRESHOLD = 5;

const stage = document.getElementById('stage');

// ---------- 图片加载 ----------

function loadImageFromBlob(blob) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    if (points.length && !confirm('已经标了 ' + points.length + ' 个点，换图会清空这些点，确定继续吗？')) {
      URL.revokeObjectURL(url);
      return;
    }
    naturalW = img.naturalWidth;
    naturalH = img.naturalHeight;
    points = [];
    nextSeq = 1;

    stage.classList.remove('empty');
    stage.innerHTML = '';
    img.id = 'map-img';
    img.draggable = false;
    img.style.width = naturalW + 'px';
    img.style.height = naturalH + 'px';

    const contentEl = document.createElement('div');
    contentEl.id = 'content';
    contentEl.appendChild(img);
    stage.appendChild(contentEl);

    document.getElementById('hover-readout').style.display = '';
    document.getElementById('zoom-box').style.display = '';

    fitToStage();
    renderPoints();
    renderExport();
  };
  img.onerror = () => alert('图片加载失败，换一张试试。');
  img.src = url;
}

function fitToStage() {
  const rect = stage.getBoundingClientRect();
  const pad = 24;
  const sx = (rect.width - pad * 2) / naturalW;
  const sy = (rect.height - pad * 2) / naturalH;
  scale = Math.max(MIN_SCALE, Math.min(sx, sy, 1));
  tx = (rect.width - naturalW * scale) / 2;
  ty = (rect.height - naturalH * scale) / 2;
  applyTransform();
}

function applyTransform() {
  const contentEl = document.getElementById('content');
  if (!contentEl) return;
  contentEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  syncMarkerCounterScale();
}

function syncMarkerCounterScale() {
  // 标记点用反向缩放抵消 #content 的 scale，保证不管怎么缩放地图，标记大小在屏幕上基本不变。
  const inv = 1 / scale;
  document.querySelectorAll('.marker').forEach(el => {
    const x = Number(el.dataset.px), y = Number(el.dataset.py);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `translate(-50%, -100%) scale(${inv})`;
  });
}

// ---------- 缩放 / 平移 ----------

function zoomAt(newScale, cx, cy) {
  newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  const localX = (cx - tx) / scale;
  const localY = (cy - ty) / scale;
  scale = newScale;
  tx = cx - localX * scale;
  ty = cy - localY * scale;
  applyTransform();
}

function stageCenter() {
  const rect = stage.getBoundingClientRect();
  return { cx: rect.width / 2, cy: rect.height / 2 };
}

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  const { cx, cy } = stageCenter();
  zoomAt(scale * 1.4, cx, cy);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  const { cx, cy } = stageCenter();
  zoomAt(scale / 1.4, cx, cy);
});
document.getElementById('btn-zoom-reset').addEventListener('click', fitToStage);

stage.addEventListener('wheel', (e) => {
  if (!naturalW) return;
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(scale * factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// ---------- 点击取点 / 拖动标记 / 平移画布 ----------

function clientToImagePx(clientX, clientY) {
  const rect = stage.getBoundingClientRect();
  const x = (clientX - rect.left - tx) / scale;
  const y = (clientY - rect.top - ty) / scale;
  return { x, y };
}

stage.addEventListener('pointerdown', (e) => {
  if (!naturalW) return;
  isPointerDown = true;
  dragMoved = 0;
  dragStartClientX = e.clientX;
  dragStartClientY = e.clientY;

  const markerEl = e.target.closest('.marker');
  if (markerEl) {
    dragMode = 'marker';
    dragMarkerIdx = Number(markerEl.dataset.idx);
  } else {
    dragMode = 'pan';
    dragStartTx = tx;
    dragStartTy = ty;
  }
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!isPointerDown) {
    // 没在拖拽时，只更新悬停坐标读数
    if (naturalW) updateHoverReadout(e);
    return;
  }
  const dx = e.clientX - dragStartClientX;
  const dy = e.clientY - dragStartClientY;
  dragMoved = Math.hypot(dx, dy);

  if (dragMode === 'pan') {
    tx = dragStartTx + dx;
    ty = dragStartTy + dy;
    applyTransform();
    stage.classList.add('panning');
  } else if (dragMode === 'marker') {
    const { x, y } = clientToImagePx(e.clientX, e.clientY);
    const p = points[dragMarkerIdx];
    if (p) {
      p.x = clamp01(x / naturalW * 100);
      p.y = clamp01(y / naturalH * 100);
      renderPoints();
      renderExport();
    }
  }
  updateHoverReadout(e);
});

stage.addEventListener('pointerup', (e) => {
  if (!isPointerDown) return;
  isPointerDown = false;
  stage.classList.remove('panning');

  if (dragMode === 'pan' && dragMoved < CLICK_DRAG_THRESHOLD) {
    const { x, y } = clientToImagePx(e.clientX, e.clientY);
    if (x >= 0 && y >= 0 && x <= naturalW && y <= naturalH) addPoint(x, y);
  } else if (dragMode === 'marker' && dragMoved < CLICK_DRAG_THRESHOLD) {
    highlightRow(dragMarkerIdx);
  }
  dragMode = null;
  dragMarkerIdx = -1;
});

function clamp01(n) { return Math.max(0, Math.min(100, n)); }

function updateHoverReadout(e) {
  const rect = stage.getBoundingClientRect();
  const { x, y } = clientToImagePx(e.clientX, e.clientY);
  const px = Math.round(x), py = Math.round(y);
  document.getElementById('hover-x').textContent = clamp01(x / naturalW * 100).toFixed(2);
  document.getElementById('hover-y').textContent = clamp01(y / naturalH * 100).toFixed(2);
  document.getElementById('hover-px').textContent = `${px}, ${py}`;
}

// ---------- 点位数据 ----------

function addPoint(px, py) {
  const n = nextSeq++;
  points.push({
    id: 'point' + n,
    name: '新地点' + n,
    type: 'investigation',
    x: Number(clamp01(px / naturalW * 100).toFixed(2)),
    y: Number(clamp01(py / naturalH * 100).toFixed(2))
  });
  renderPoints();
  renderExport();
  highlightRow(points.length - 1, true);
}

function renderPoints() {
  const list = document.getElementById('point-list');
  if (points.length === 0) {
    list.innerHTML = '<div id="empty-list-hint">还没有点。在左边地图上点击一下试试——<br>点击 = 新增一个点，拖动已有的点 = 微调位置。</div>';
  } else {
    list.innerHTML = points.map((p, i) => `
      <div class="point-row" data-idx="${i}">
        <div class="line1">
          <span class="idx">${i + 1}</span>
          <input type="text" data-field="id" value="${escapeAttr(p.id)}" placeholder="id" title="id（英文/驼峰，对应 hotspots.json 里的 id）">
          <input type="text" data-field="name" value="${escapeAttr(p.name)}" placeholder="显示名">
        </div>
        <div class="line2">
          <select data-field="type">
            <option value="investigation" ${p.type === 'investigation' ? 'selected' : ''}>investigation</option>
            <option value="basecamp" ${p.type === 'basecamp' ? 'selected' : ''}>basecamp</option>
          </select>
          <input type="number" data-field="x" value="${p.x}" step="0.01" min="0" max="100" title="x %">
          <input type="number" data-field="y" value="${p.y}" step="0.01" min="0" max="100" title="y %">
          <button class="del" data-idx="${i}">删除</button>
        </div>
      </div>
    `).join('');
  }

  // 地图上的标记
  const contentEl = document.getElementById('content');
  contentEl.querySelectorAll('.marker').forEach(el => el.remove());
  points.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'marker' + (p.type === 'basecamp' ? ' basecamp' : '');
    el.dataset.idx = i;
    el.dataset.px = (p.x / 100 * naturalW).toFixed(2);
    el.dataset.py = (p.y / 100 * naturalH).toFixed(2);
    el.innerHTML = `<span class="tag">${escapeHTML(p.id || ('#' + (i + 1)))}</span><span class="dot"></span>`;
    contentEl.appendChild(el);
  });
  syncMarkerCounterScale();

  bindRowEvents();
}

function bindRowEvents() {
  document.querySelectorAll('.point-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelectorAll('input,select').forEach(input => {
      input.addEventListener('input', () => {
        const field = input.dataset.field;
        const p = points[idx];
        if (!p) return;
        if (field === 'x' || field === 'y') {
          p[field] = Number(clamp01(parseFloat(input.value) || 0).toFixed(2));
          updateMarkerPosition(idx);
        } else {
          p[field] = input.value;
          const marker = document.querySelector(`.marker[data-idx="${idx}"] .tag`);
          if (marker && field === 'id') marker.textContent = input.value || ('#' + (idx + 1));
          if (marker && field === 'type') marker.parentElement.className = 'marker' + (input.value === 'basecamp' ? ' basecamp' : '');
        }
        renderExport();
      });
    });
  });
  document.querySelectorAll('.point-row .del').forEach(btn => {
    btn.addEventListener('click', () => {
      points.splice(Number(btn.dataset.idx), 1);
      renderPoints();
      renderExport();
    });
  });
}

function updateMarkerPosition(idx) {
  const p = points[idx];
  const el = document.querySelector(`.marker[data-idx="${idx}"]`);
  if (!p || !el) return;
  el.dataset.px = (p.x / 100 * naturalW).toFixed(2);
  el.dataset.py = (p.y / 100 * naturalH).toFixed(2);
  syncMarkerCounterScale();
}

function highlightRow(idx, scroll) {
  document.querySelectorAll('.point-row').forEach(r => r.classList.remove('highlight'));
  const row = document.querySelector(`.point-row[data-idx="${idx}"]`);
  if (row) {
    row.classList.add('highlight');
    if (scroll) row.scrollIntoView({ block: 'nearest' });
  }
  const marker = document.querySelector(`.marker[data-idx="${idx}"]`);
  if (marker) {
    marker.classList.add('flash');
    setTimeout(() => marker.classList.remove('flash'), 650);
  }
}

document.getElementById('btn-clear-points').addEventListener('click', () => {
  if (points.length === 0) return;
  if (!confirm('清空全部 ' + points.length + ' 个点？')) return;
  points = [];
  renderPoints();
  renderExport();
});

// ---------- 导出 ----------

function renderExport() {
  const mapImage = document.getElementById('map-image-path').value.trim() || '/assets/maps/你的地图.png';
  const data = {
    mapImage,
    hotspots: points.map(p => ({
      id: p.id, name: p.name, x: p.x, y: p.y, type: p.type
    }))
  };
  document.getElementById('export-json').value = JSON.stringify(data, null, 2);
}
document.getElementById('map-image-path').addEventListener('input', renderExport);

document.getElementById('btn-copy').addEventListener('click', async () => {
  const text = document.getElementById('export-json').value;
  const statusEl = document.getElementById('copy-status');
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = '已复制到剪贴板 ✓';
  } catch (err) {
    // file:// 下部分浏览器可能拒绝 clipboard API，退回选中文本手动复制
    const ta = document.getElementById('export-json');
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      statusEl.textContent = '已复制到剪贴板 ✓';
    } catch (err2) {
      statusEl.textContent = '自动复制失败，已帮你选中文本，Ctrl+C 手动复制';
    }
  }
  setTimeout(() => { statusEl.textContent = ''; }, 2500);
});

document.getElementById('btn-download').addEventListener('click', () => {
  const text = document.getElementById('export-json').value;
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hotspots.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function escapeHTML(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function escapeAttr(s) {
  return escapeHTML(s).replace(/"/g, '&quot;');
}

// ---------- 图片输入：选择 / 拖放 / 粘贴 ----------

document.getElementById('btn-pick-file').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) loadImageFromBlob(file);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach(evt => {
  stage.addEventListener(evt, (e) => {
    e.preventDefault();
    stage.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  stage.addEventListener(evt, (e) => {
    e.preventDefault();
    stage.classList.remove('dragover');
  });
});
stage.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImageFromBlob(file);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) loadImageFromBlob(file);
      break;
    }
  }
});

window.addEventListener('resize', () => {
  if (naturalW) applyTransform();
});
</script>
</body>
</html>
