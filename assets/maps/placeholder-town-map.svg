<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe3c4"/>
      <stop offset="55%" stop-color="#e4d5ac"/>
      <stop offset="100%" stop-color="#d5c090"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e2c8"/>
      <stop offset="100%" stop-color="#cbbf94"/>
    </linearGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#parchment)"/>
  <rect x="0" y="0" width="1200" height="800" filter="url(#rough)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#vignette)"/>

  <!-- decorative border -->
  <rect x="24" y="24" width="1152" height="752" fill="none" stroke="#5b4636" stroke-width="3"/>
  <rect x="34" y="34" width="1132" height="732" fill="none" stroke="#5b4636" stroke-width="1"/>
  <circle cx="24" cy="24" r="5" fill="#5b4636"/>
  <circle cx="1176" cy="24" r="5" fill="#5b4636"/>
  <circle cx="24" cy="776" r="5" fill="#5b4636"/>
  <circle cx="1176" cy="776" r="5" fill="#5b4636"/>

  <!-- title -->
  <text x="600" y="78" text-anchor="middle" font-size="30" fill="#4a3826" letter-spacing="4" font-weight="700">白湖镇　地图（占位版）</text>
  <text x="600" y="102" text-anchor="middle" font-size="13" fill="#7a6a4f" letter-spacing="2">PLACEHOLDER TOWN MAP · 10 SITES + 1 BASECAMP</text>
  <line x1="430" y1="116" x2="770" y2="116" stroke="#7a6a4f" stroke-width="1"/>

  <!-- dry lake bed (干湖 / White Lake Dry Bed): cracked alkali flat, not open water -->
  <path d="M 130 545 Q 110 600 160 640 Q 220 685 300 655 Q 360 630 330 580 Q 300 530 240 535 Q 170 520 130 545 Z"
        fill="url(#lake)" stroke="#a8996a" stroke-width="2"/>
  <path d="M 160 570 L 200 610 M 210 560 L 190 630 M 250 555 L 270 620 M 150 610 L 190 600"
        stroke="#a8996a" stroke-width="1" opacity="0.5"/>

  <!-- roads (dashed, radiating from town square) -->
  <g stroke="#8a7550" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M600 400 L 350 250"/>
    <path d="M600 400 L 850 230"/>
    <path d="M600 400 L 950 450"/>
    <path d="M600 400 L 450 550"/>
    <path d="M600 400 L 240 585"/>
    <path d="M600 400 L 700 150"/>
    <path d="M600 400 L 1050 650"/>
    <path d="M600 400 L 150 150"/>
    <path d="M600 400 L 900 700"/>
    <path d="M700 150 L 850 230"/>
    <path d="M150 150 L 350 250"/>
    <path d="M950 450 L 1050 650"/>
    <path d="M450 550 L 900 700"/>
  </g>

  <!-- entrance road: gas station -> town square (solid, distinct from in-town dashed roads) -->
  <path d="M 90 500 L 600 400" stroke="#a8452f" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- compass rose -->
  <g transform="translate(1080,120)">
    <circle r="42" fill="none" stroke="#5b4636" stroke-width="1.5"/>
    <path d="M0,-38 L8,0 L0,38 L-8,0 Z" fill="#5b4636"/>
    <path d="M-38,0 L0,8 L38,0 L0,-8 Z" fill="#a8452f"/>
    <text x="0" y="-48" text-anchor="middle" font-size="14" fill="#4a3826" font-weight="700">N</text>
  </g>

  <!-- ============ BASECAMP ============ -->
  <!-- 0: 废弃加油站 (basecamp / entry point / only signal spot) -->
  <g transform="translate(90,500)">
    <circle r="34" fill="none" stroke="#a8452f" stroke-width="2" stroke-dasharray="3 4" opacity="0.7"/>
    <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#3c2f1e" stroke="#a8452f" stroke-width="3"/>
    <!-- fuel pump icon -->
    <rect x="-10" y="-12" width="16" height="22" rx="2" fill="none" stroke="#f2c14e" stroke-width="2"/>
    <line x1="6" y1="-6" x2="14" y2="-6" stroke="#f2c14e" stroke-width="2"/>
    <line x1="14" y1="-6" x2="14" y2="6" stroke="#f2c14e" stroke-width="2"/>
    <line x1="14" y1="6" x2="10" y2="6" stroke="#f2c14e" stroke-width="2"/>
    <!-- signal bars -->
    <rect x="-6" y="6" width="3" height="5" fill="#f2c14e"/>
    <rect x="-1" y="3" width="3" height="8" fill="#f2c14e"/>
    <rect x="4" y="0" width="3" height="11" fill="#f2c14e"/>
    <text x="0" y="52" text-anchor="middle" font-size="16" fill="#a8452f" font-weight="700">废弃加油站</text>
    <text x="0" y="70" text-anchor="middle" font-size="11" fill="#7a6a4f">起点 · 唯一信号点 · 每日发布处</text>
  </g>

  <!-- ============ LOCATIONS ============ -->
  <!-- helper style: pin + number + icon + label -->

  <!-- 1: 中心广场 (town square) -->
  <g transform="translate(600,400)">
    <circle r="26" fill="#a8452f" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">1</text>
    <rect x="-7" y="34" width="14" height="10" fill="#5b4636"/>
    <text x="0" y="66" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">中心广场</text>
  </g>

  <!-- 2: 旧书馆 (library) -->
  <g transform="translate(350,250)">
    <circle r="24" fill="#5b7a9c" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">2</text>
    <rect x="-8" y="-6" width="16" height="12" fill="none" stroke="#fff" stroke-width="1.4"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="1.2"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">旧书馆</text>
  </g>

  <!-- 3: 康宁诊所 (clinic) -->
  <g transform="translate(850,230)">
    <circle r="24" fill="#7a9c6f" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">3</text>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#fff" stroke-width="2.4"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#fff" stroke-width="2.4"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">康宁诊所</text>
  </g>

  <!-- 4: 白鹭旅店 (inn) -->
  <g transform="translate(950,450)">
    <circle r="24" fill="#c08a3e" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">4</text>
    <rect x="-8" y="-2" width="16" height="8" fill="none" stroke="#fff" stroke-width="1.4"/>
    <line x1="-8" y1="-2" x2="0" y2="-9" stroke="#fff" stroke-width="1.2"/>
    <line x1="0" y1="-9" x2="8" y2="-2" stroke="#fff" stroke-width="1.2"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">白鹭旅店</text>
  </g>

  <!-- 5: 灯笼集市 (market) -->
  <g transform="translate(450,550)">
    <circle r="24" fill="#c0673e" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">5</text>
    <path d="M-8,-4 L8,-4 L6,7 L-6,7 Z" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">灯笼集市</text>
  </g>

  <!-- 6: 干湖 (dry lake bed edge) -->
  <g transform="translate(240,585)">
    <circle r="24" fill="#b0a274" stroke="#4a3826" stroke-width="2"/>
    <path d="M-8,-6 L-2,0 L-8,6 M2,-6 L8,0 L2,6" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">6</text>
    <text x="0" y="62" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">干湖</text>
  </g>

  <!-- 7: 圣礼教堂 (chapel) -->
  <g transform="translate(700,150)">
    <circle r="24" fill="#8a6fa0" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">7</text>
    <line x1="0" y1="-9" x2="0" y2="7" stroke="#fff" stroke-width="1.6"/>
    <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#fff" stroke-width="1.6"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">圣礼教堂</text>
  </g>

  <!-- 8: 火车站 (station) -->
  <g transform="translate(1050,650)">
    <circle r="24" fill="#5b6b7a" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">8</text>
    <rect x="-8" y="-6" width="16" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.4"/>
    <circle cx="-4" cy="6" r="1.6" fill="#fff"/>
    <circle cx="4" cy="6" r="1.6" fill="#fff"/>
    <text x="0" y="62" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">火车站</text>
  </g>

  <!-- 9: 灯塔 (lighthouse) -->
  <g transform="translate(150,150)">
    <circle r="24" fill="#c9a13e" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">9</text>
    <path d="M-4,8 L-3,-8 L3,-8 L4,8 Z" fill="none" stroke="#fff" stroke-width="1.4"/>
    <line x1="-5" y1="-8" x2="5" y2="-8" stroke="#fff" stroke-width="1.4"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">灯塔</text>
  </g>

  <!-- 10: 墓园 (cemetery) -->
  <g transform="translate(900,700)">
    <circle r="24" fill="#6b6357" stroke="#4a3826" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">10</text>
    <line x1="0" y1="-8" x2="0" y2="7" stroke="#fff" stroke-width="1.6"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#fff" stroke-width="1.6"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#3c2f1e" font-weight="700">墓园</text>
  </g>

  <!-- legend -->
  <g transform="translate(48,745)">
    <text x="0" y="0" font-size="11" fill="#6a5a42">图钉编号对应 hotspots.json 中的 id 顺序 · 加油站为 basecamp 类型，其余为 investigation 类型 · 坐标为示意，非最终定稿</text>
  </g>
</svg>
