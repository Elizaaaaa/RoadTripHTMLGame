<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公路旅行禁止偏航</title>
<link rel="stylesheet" href="engine/ui.css">
<link rel="stylesheet" href="engine/phone.css">
</head>
<body>
  <div id="app">
    <header id="status-bar">
      <div class="menu-left">
        <span class="menu-brand">●</span>
        <span id="day-display">第 1 天</span>
      </div>
      <div class="menu-right">
        <span id="sanity-display" class="menu-item">理智：清醒</span>
        <span id="clock-display" class="menu-item">20:00</span>
        <div class="status-buttons">
          <button id="btn-review" class="menu-pill">🎬 开始剪辑</button>
          <button id="btn-notebook" class="menu-pill">📓 记事本<span class="notif-dot hidden" id="notebook-dot"></span></button>
          <button id="btn-tracker" class="menu-pill">📌 调查回顾</button>
          <!-- 掏出手机：主屏 + 信息/后台/相册，不消耗游戏内时间（见 engine/home.js） -->
          <button id="btn-phone" class="menu-pill">📱 手机</button>
          <button id="btn-time-control" class="menu-pill">⏪ 时间线</button>
          <!-- 调试按钮：只在地址栏带 ?debug=1 时才露出来（见 engine/main.js 的 wireDebugButtons）。
               正式游玩时这一组是 hidden 的，玩家看不到也点不到，所以不用担心漏进成品。 -->
          <span id="debug-buttons" class="hidden">
            <button id="btn-debug-scan" class="menu-pill menu-pill-debug">🔍 演一次扫描</button>
            <button id="btn-debug-tick" class="menu-pill menu-pill-debug">⏩ 立刻触发循环</button>
            <button id="btn-debug-sanity" class="menu-pill menu-pill-debug">🧠 理智→20</button>
            <span id="debug-scan-status" class="menu-item debug-status">循环未开启</span>
          </span>
        </div>
      </div>
    </header>

    <main id="map-viewport"></main>

    <div id="map-controls">
      <button id="zoom-in" title="放大">+</button>
      <button id="zoom-out" title="缩小">&minus;</button>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- 剪辑台里左键点击某段素材弹出的小窗，显示这段素材的内容简介；叠在 #modal-overlay 之上。 -->
  <div id="clip-info-overlay" class="modal-overlay clip-info-overlay hidden">
    <div id="clip-info-box" class="modal-box modal-box-small"></div>
  </div>

  <!-- 折叠纸条演出：事件正文里配了 paperSegments 的那一页不进弹窗，改成这张纸条在屏幕
       中央翻开（对折：上半块不动，下半块绕中间那道折痕转回来），摊平之后字迹才淡入，点一下
       整张淡出。骨架放在这里、文字由 engine/paper.js 填，样式见 ui.css「折叠纸条演出」一节。 -->
  <div id="paper-overlay" class="paper-overlay hidden">
    <div class="paper-stage">
      <div class="paper-sheet">
        <div class="paper-fold paper-fold-top"></div>
        <div class="paper-fold paper-fold-bot"></div>
        <div class="paper-body"></div>
      </div>
    </div>
    <div class="paper-hint">点一下收起</div>
  </div>

  <!-- 手机：一台 2019 年的 iPhone XS（375×812 刘海机 / iOS 12 日间配色 / 橙红中框）。
       外壳、刘海、状态栏、姿态和进出场由 engine/phone.js 统一生成——它是个可复用的容器，
       屏幕里装哪个 app 由调用方决定：engine/vlogstats.js 的 vlog 数据页（发布之后从画面
       上方落到正中），engine/chat.js 的 QQ/BB 聊天（事件后闲聊，从右下角升起、停在角落
       不压住事件正文）。样式见 engine/phone.css，整机零美术素材。 -->
  <div id="phone-overlay" class="phone-overlay hidden"></div>

  <!-- 地震演出的落灰层：平时 hidden，engine/quake.js 播放时才显示（见 ui.css「地震演出」一节）。
       盖在所有弹窗之上、不挡点击，内容全是 CSS 渐变，不需要任何图片素材。 -->
  <div id="quake-overlay" class="hidden" aria-hidden="true">
    <div class="quake-veil"></div>
    <div class="quake-dust"></div>
  </div>

  <!-- 监控信号异常演出：时间线回退时的转场（engine/glitch.js）。平时 hidden；播放时盖住
       所有东西，把"换状态"那一下藏在雪花后面，时间码重新锁上时显示回到了哪一刻。
       跟落灰层一样零美术素材，全是 CSS 渐变，见 ui.css「监控信号异常」一节。 -->
  <div id="glitch-overlay" class="hidden" aria-hidden="true">
    <div class="gl-snow"></div>
    <div class="gl-scan"></div>
    <div class="gl-roll"></div>
    <div class="gl-tear gl-tear-1"></div>
    <div class="gl-tear gl-tear-2"></div>
    <div class="gl-tear gl-tear-3"></div>
    <div class="gl-vignette"></div>
    <div class="gl-osd">
      <span class="gl-osd-rec">● REC</span>
      <span class="gl-osd-cam">CAM 01</span>
      <span class="gl-osd-stamp"></span>
      <span class="gl-osd-note"></span>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- 手机竖屏时盖住全部内容，提示转横屏；纯 CSS 媒体查询控制显隐，不依赖 JS，也不挡桌面端窄窗口 -->
  <div id="orientation-overlay">
    <div class="orientation-icon">📱</div>
    <div class="orientation-text">请将手机横过来体验</div>
    <div class="orientation-hint">转了没反应？看看是不是开着竖屏方向锁定</div>
  </div>

  <script type="module" src="engine/main.js"></script>
</body>
</html>
